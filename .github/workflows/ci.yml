name: CI

# The order follows what each failure costs to ignore: a leaked secret is
# unrecoverable once pushed, a broken API contract breaks every client, a broken
# screen breaks one screen. No job needs a secret; every AI step is offline.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Compatibility floor for the installed native SQLite binding (Node-API 10),
  # not a security recommendation for ordinary deployments.
  NODE_VERSION: '22.14.0'

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scan the history, not just the tip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      # --redact keeps any finding out of the public log.
      - name: Scan for secrets
        run: node scripts/verify-ci.js --group secrets

      - name: Retain secret-scan verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/verification/*/summary.json
          if-no-files-found: warn
          retention-days: 7

  api:
    name: API checks (newman)
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # One source defines the same offline tasks for local and CI. The Newman
      # runner mints its own throwaway secret; no .env or external URL is read.
      - name: Run API verification group
        run: node scripts/verify-ci.js --group api

      - name: Retain allowlisted API and race evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/reports/verification/*/summary.json
            qa/reports/verification/*/api-report.html
            qa/reports/verification/*/api-junit.xml
            qa/reports/verification/*/race-summary.json
          if-no-files-found: warn
          retention-days: 7

  python:
    name: API scenarios (pytest)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      # pytest starts the real Node server, so this job needs both runtimes.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: qa/python/requirements.txt
      - run: python -m pip install -r qa/python/requirements.txt
      - name: Run Python API scenarios
        run: node scripts/verify-ci.js --group python
        env:
          PYTHON: python

      - name: Retain allowlisted Python evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/reports/verification/*/summary.json
            qa/reports/verification/*/python-junit.xml
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility verification group
        run: node scripts/verify-ci.js --group e2e
      - name: Retain browser verification verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/verification/*/summary.json
          if-no-files-found: warn
          retention-days: 7
      # The report and traces only when something failed, and only for a week.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            qa/reports/playwright-main/results-*.json
            qa/reports/playwright-a11y/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  selenium:
    name: UI checks (Selenium + pytest)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      # pytest starts the real Node server, so this job needs both runtimes.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: qa/python/requirements.txt
      - run: python -m pip install -r qa/python/requirements.txt
      # The runner's own Chrome; Selenium Manager fetches the driver that matches it.
      - name: Run the Selenium browser checks
        run: node scripts/verify-ci.js --group selenium
        env:
          PYTHON: python
      - name: Retain Selenium verification verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-selenium-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/verification/*/summary.json
          if-no-files-found: warn
          retention-days: 7
      # Each failed test's screenshot, page source and console, only when
      # something failed, and only for a week.
      - name: Upload Selenium failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/selenium/
          if-no-files-found: ignore
          retention-days: 7

  ai:
    name: AI expense entry (offline)
    runs-on: ubuntu-latest
    needs: api
    # No AI key exists here: the network guard is preloaded, the provider is a
    # local fake, and the evaluator runs in fixture mode.
    env:
      WALLET_AI_MODE: 'off'
      WALLET_AI_EVAL_LIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run offline AI and browser verification group
        run: node scripts/verify-ci.js --group ai
      - name: Retain AI verification verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-ai-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/reports/verification/*/summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload AI browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ai-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/reports/playwright-ai/
            test-results/ai/
          if-no-files-found: ignore
          retention-days: 7
