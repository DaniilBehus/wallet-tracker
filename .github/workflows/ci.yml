name: CI

# The order follows what each failure costs to ignore: a leaked secret is
# unrecoverable once pushed, a broken API contract breaks every client, a broken
# screen breaks one screen. No job needs a secret; every AI step is offline.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The floor this project claims in package.json; better-sqlite3 needs >= 22.
  NODE_VERSION: '22'

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # scan the history, not just the tip

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      # --redact keeps any finding out of the public log.
      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --verbose --exit-code 1

  api:
    name: API checks (newman)
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Self-check gate
        run: npm run check

      # The in-place database upgrade, on temporary files it makes itself. No
      # server and no secret, so it runs before anything is started.
      - name: Database migration test
        run: npm run test:db

      # A throwaway secret per run; nothing signed with it outlives the job.
      - name: Generate a throwaway secret
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"

      # run.js starts its own server, port and throwaway database.
      - name: Run the Postman collection
        run: npm run test:api

  python:
    name: API scenarios (pytest)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      # pytest starts the real Node server, so this job needs both runtimes.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: qa/python/requirements.txt
      - run: python -m pip install -r qa/python/requirements.txt
      - name: Run Python API scenarios
        run: npm run test:python
        env:
          PYTHON: python

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          # playwright.config.js starts the server itself through webServer.
          JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-secret
          DB_PATH: ${{ runner.temp }}/e2e-wallet.db
          CI: 'true'
      # The report and traces only when something failed, and only for a week.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  ai:
    name: AI expense entry (offline)
    runs-on: ubuntu-latest
    needs: api
    # No AI key exists here: the network guard is preloaded, the provider is a
    # local fake, and the evaluator runs in fixture mode.
    env:
      WALLET_AI_MODE: 'off'
      WALLET_AI_EVAL_LIVE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Unit, integration, idempotency, guard, evaluator and demo tests
        run: npm run test:ai
      - name: Fixture evaluation (does not measure a model)
        run: npm run eval:ai
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: AI browser suite
        run: npm run test:ai:e2e
        env:
          CI: 'true'
