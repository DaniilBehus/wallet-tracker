<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2730" viewBox="0 0 1800 2730" role="img"><title>Dátový model Wallet</title><desc>Sedem tabuliek a osem deklarovaných FK vzťahov; zámerné polia bez FK sú označené.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2730" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">06</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYTICKÁ MAPA</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Dátový model · sedem tabuliek</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Hore sedem tabuliek; v mape vzťahov osem deklarovaných cudzích kľúčov</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="2657" x2="1730" y2="2657" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2693" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULÁRNA SÉRIA</text><text x="1730" y="2693" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">06 / 06</text><rect x="70" y="278" width="1660" height="55" rx="14" fill="#E8F4F1" stroke="#E8F4