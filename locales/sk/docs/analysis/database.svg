ll="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="1210" y="727" width="520" height="59" rx="21" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1232" y="767" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">transaction_requests</text><text x="1710" y="766" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#61747A" text-anchor="end">OPAKOVANIE</text><text x="1232" y="828" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">PK (user_id, operation_key)</text><text x="1232" y="861" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">user_id FK → users; payload_hash</text><text x="1232" y="894" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">transaction_id zámerne BEZ FK</text><text x="1232" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">response_json; created_at</text><rect x="70" y="1099" width="520" height="281" rx="21" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1099" width="520" height="59" rx="21" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="92" y="1139" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ai_quota</text><text x="570" y="1138" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#61747A" text-anchor="end">ODDELENÉ</text><text x="92" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">PK (period, scope, user_id)</text><text x="92" y="1233" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">scope enum; count ≥ 0</text><text x="92" y="1266" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">user_id = 0 globálne; BEZ FK</text><rect x="640" y="1099" width="1090" height="281" rx="21" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="668" y="1150" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#B9761C" text-anchor="start">ZÁMERNE BEZ CUDZIEHO KĽÚČA</text><text x="668" y="1198" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">transaction_requests.transaction_id zachová záznam po vymazaní.</text><text x="668" y="1238" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">ai_quota.user_id používa 0 pre globálne počítadlo.</text><text x="668" y="1278" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Ani jedno pole nevytvára čiaru vzťahu nižšie.</text><rect x="70" y="1431" width="1660" height="55" rx="14" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="91" y="1468" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0D625F" text-anchor="start">SIEŤ FK  ·  osem skutočných väzieb</text><rect x="70" y="1650" width="340" height="175" rx="18" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="90" y="1693" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#193039" text-anchor="start">users</text><text x="90" y="1731" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#61747A" text-anchor="start">jeden rodič</text><rect x="560" y="1610" width="300" height="130" rx="18" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="580" y="1653" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#193039" text-anchor="start">categories</text><text x="580" y="1691" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#61747A" text-anchor="s