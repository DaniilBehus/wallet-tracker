<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2180" viewBox="0 0 1800 2180" role="img"><title>Limity výdavkov kategórií</title><desc>Nezávislé zápisy a súhrn mesiaca vytvoria štyri stavy limitu každej kategórie.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2180" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYTICKÁ MAPA</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Limity kategórií · modulárna mapa</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Príkazy zapisujú nezávisle; dotaz zostaví a vyhodnotí viditeľné riadky</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="2107" x2="1730" y2="2107" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2143" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULÁRNA SÉRIA</text><text x="1730" y="2143" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">04 / 06</text><rect x="70" y="292" width="760" height="658" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PRÍKAZY</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ZÁPIS</text><rect x="970" y="292" width="760" height="658" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ULOŽENIE</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">SQLITE</text><rect x="100" y="392" width="700" height="120" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PATCH vlastnej kategórie</text><text x="122" y="474" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Iba pole limitu; 0 platí, NULL zruší.</text><rect x="100" y="542" width="700" height="120" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Validovať + overiť vlastníka</text><text x="122" y="624" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Prázdny / neznámy PATCH → 400; cudzí / chýbajúci → 404.</text><path d="M450 512 V540" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="100" y="693" width="700" height="120" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="736" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Zaznamenať výdavok / zaplatenú splátku</text><text x="122" y="775" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Nezávislá akcia: limit neblokuje uloženie.</text><rect x="1000" y="392" width="700" height="120" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Limit kategórie L</text><text x="1022" y="474" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Aktuálne celé centy alebo NULL; bez histórie.</text><rect x="1000" y="693" width="700" height="120" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="736" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Skutočné výdavky</text><text x="1022" y="775" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Platná platba sa uloží aj nad limit.</text><path d="M800 602 H900 V452 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="855" y="584" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0D625F" text-anchor="start">platný PATCH</text><path d="M800 753 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="855" y="738" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0D625F" text-anchor="start">platné uloženie</text><rect x="100" y="842" width="700" height="72" rx="15" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="122" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#B64E47" text-anchor="start">ODMIETNUTÝ PATCH → bez zápisu</text><path d="M450 662 V675 H80 V878 H98" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)"/><rect x="70" y="1060" width="760" height="650" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1060" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">DOTAZ NA SÚHRN</text><text x="806" y="1101" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ČÍTANIE</text><rect x="970" y="1060" width="760" height="650" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="1060" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">VYHODNOTENIE RIADKOV</text><text x="1706" y="1101" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ODVODENÉ</text><rect x="100" y="1160" width="700" height="116" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">GET zvoleného mesiaca</text><text x="122" y="1242" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Samostatne alebo po úspešnom zápise.</text><rect x="100" y="1307" width="700" height="133" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1350" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Agregovať T</text><text x="122" y="1389" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Uložené výdavky vrátane zaplatených splátok;</text><text x="122" y="1423" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">bez nezaplatených splátok a príjmu.</text><rect x="100" y="1471" width="700" height="170" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1514" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Viditeľné riadky</text><text x="122" y="1553" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">S limitom T = 0 zobrazené; bez limitu T = 0 skryté.</text><text x="122" y="1587" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Bez kategórie len pri T &gt; 0; bez editora limitu.</text><path d="M450 1276 V1305" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 1440 V1469" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 950 V1000 H450 V1158" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><text x="780" y="1030" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="start">čítať výdavky + aktuálne L</text><rect x="1000" y="1160" width="700" height="145" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Aktuálne L a skutočné T</text><text x="1022" y="1242" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">NULL = not_set; inak porovnať každý riadok.</text><text x="1022" y="1276" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Aktuálny limit platí aj pre minulý mesiac.</text><path d="M800 1555 H900 V1235 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="1350" width="330" height="115" rx="16" fill="#EFF2EF" stroke="#EFF2EF" stroke-width="0"/><text x="1018" y="1392" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">NENASTAVENÝ</text><text x="1018" y="1437" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">L = NULL</text><rect x="1350" y="1350" width="330" height="115" rx="16" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1368" y="1392" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">V LIMITE</text><text x="1368" y="1437" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &lt; L</text><rect x="1000" y="1510" width="330" height="115" rx="16" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1018" y="1552" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B9761C" text-anchor="start">DOSIAHNUTÝ</text><text x="1018" y="1597" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T = L</text><rect x="1350" y="1510" width="330" height="115" rx="16" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="1368" y="1552" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B64E47" text-anchor="start">PREKROČENÝ</text><text x="1368" y="1597" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &gt; L</text><path d="M1360 1305 V1324 H1165 V1348" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1324 H1515 V1348" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1324 H1715 V1480 H1165 V1508" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1715 1480 H1515 V1508" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="1770" width="1660" height="228" rx="22" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="98" y="1819" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#B9761C" text-anchor="start">PRAVIDLÁ ČÍTANIA</text><text x="98" y="1862" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">Zvyšok L − T sa počíta, neukladá. L = 0 a T = 0 je DOSIAHNUTÝ.</text><text x="98" y="1904" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">Celkový a kategórny limit sú nezávislé. Stav kategórie neodmietne platné uloženie.</text><path d="M1360 1710 V1740 H900 V1768" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/></svg>