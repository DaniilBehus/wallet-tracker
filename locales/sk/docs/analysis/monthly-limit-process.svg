<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2070" viewBox="0 0 1800 2070" role="img"><title>Celkový mesačný limit</title><desc>Aktuálne nastavenie a uložené výdavky sa porovnajú pri čítaní; limit neblokuje platný zápis.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2070" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYTICKÁ MAPA</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Celkový mesačný limit</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Aktuálny limit a skutočné výdavky určujú stav pri čítaní; ukladanie neblokujú</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="1997" x2="1730" y2="1997" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2033" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULÁRNA SÉRIA</text><text x="1730" y="2033" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">03 / 06</text><rect x="70" y="292" width="760" height="638" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PRÍKAZY</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ZÁPIS</text><rect x="970" y="292" width="760" height="638" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ULOŽENIE</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">SQLITE</text><rect x="100" y="389" width="700" height="160" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Zápis nastavení</text><text x="122" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Vyžaduje monthly_income_cents.</text><text x="122" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Celé L = 0..100000000 centov; NULL zruší.</text><rect x="100" y="581" width="700" height="140" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="624" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Vynechanie limitu / odmietnutie vstupu</text><text x="122" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Vynechanie zachová aktuálne L.</text><text x="122" y="697" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Neplatný zápis nastavení → bez zmeny.</text><rect x="100" y="751" width="700" height="133" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="794" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Zaznamenať platný výdavok</text><text x="122" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Validácia výdavku nezávisí od L.</text><rect x="1000" y="389" width="700" height="160" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Aktuálny riadok nastavení</text><text x="1022" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Príjem je osobitný; L má jednu aktuálnu hodnotu.</text><text x="1022" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">NULL = bez limitu; 0 je skutočný limit.</text><rect x="1000" y="751" width="700" height="133" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="794" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Riadky skutočných výdavkov</text><text x="1022" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Platný výdavok sa uloží, aj keď T presiahne L.</text><path d="M800 469 H900 V469 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="846" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0D625F" text-anchor="start">platné nastavenia</text><path d="M800 816 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="850" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0D625F" text-anchor="start">platné uloženie</text><rect x="70" y="1020" width="760" height="585" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1020" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">DOTAZ NA ZVOLENÝ MESIAC</text><text x="806" y="1061" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ČÍTANIE</text><rect x="970" y="1020" width="760" height="585" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="1020" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">VYHODNOTENIE STAVU</text><text x="1706" y="1061" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ODVODENÉ</text><rect x="100" y="1118" width="700" height="125" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="1161" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">GET zvoleného mesiaca</text><text x="122" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Samostatné čítanie nepotrebuje zápis.</text><rect x="100" y="1277" width="700" height="163" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1320" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Agregovať T</text><text x="122" y="1359" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Súčet uložených výdavkov za daný mesiac.</text><text x="122" y="1393" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Príjem sa nezahŕňa.</text><rect x="100" y="1472" width="700" height="105" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1515" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Použiť aktuálne L</text><text x="122" y="1554" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Aktuálny limit platí aj pre minulé mesiace.</text><path d="M450 1243 V1275" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 1440 V1470" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 930 V980 H450 V1116" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><text x="764" y="998" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">čítať výdavky + aktuálne nastavenia</text><rect x="1000" y="1118" width="700" height="141" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="1161" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Porovnať T s L</text><text x="1022" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">L = NULL → not_set; inak porovnať.</text><text x="1022" y="1234" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Zvyšok L − T sa počíta, neukladá.</text><path d="M800 1525 H900 V1188 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="1300" width="330" height="114" rx="17" fill="#EFF2EF" stroke="#EFF2EF" stroke-width="0"/><text x="1019" y="1343" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">NENASTAVENÝ</text><text x="1019" y="1388" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">L = NULL</text><rect x="1350" y="1300" width="330" height="114" rx="17" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1369" y="1343" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">V LIMITE</text><text x="1369" y="1388" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &lt; L</text><rect x="1000" y="1447" width="330" height="114" rx="17" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1019" y="1490" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B9761C" text-anchor="start">DOSIAHNUTÝ</text><text x="1019" y="1535" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T = L</text><rect x="1350" y="1447" width="330" height="114" rx="17" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="1369" y="1490" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B64E47" text-anchor="start">PREKROČENÝ</text><text x="1369" y="1535" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &gt; L</text><path d="M1360 1259 V1276 H1165 V1298" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1276 H1515 V1298" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1276 H1715 V1428 H1165 V1445" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1715 1428 H1515 V1445" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="1683" width="1660" height="231" rx="21" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="98" y="1730" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#B9761C" text-anchor="start">PRAVIDLÁ LIMITU</text><text x="98" y="1778" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">L = 0 a T = 0 je DOSIAHNUTÝ. Zvyšok môže byť záporný; bez limitu je NULL.</text><text x="98" y="1815" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Každý platný výdavok možno uložiť v každom stave. Celkový a kategórne limity sú nezávislé;</text><text x="98" y="1852" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">zápis celkových nastavení nevaliduje súčet kategórnych limitov.</text><path d="M1360 1605 V1645 H900 V1681" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/></svg>