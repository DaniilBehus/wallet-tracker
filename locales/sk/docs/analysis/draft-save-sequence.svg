<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2190" viewBox="0 0 1800 2190" role="img"><title>Návrh a výslovné uloženie</title><desc>Tri moduly ukazujú návrh, kontrolu, uloženie s kľúčom a výsledky opakovania.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2190" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYTICKÁ MAPA</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Návrh → Uloženie · modulárna mapa</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Tri moduly spájajú tvorbu návrhu, kontrolu a uloženie s kľúčom</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="2117" x2="1730" y2="2117" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2153" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULÁRNA SÉRIA</text><text x="1730" y="2153" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">05 / 06</text><rect x="70" y="292" width="760" height="732" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">TVORBA NÁVRHU</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">BEZ ZÁPISU VÝDAVKU</text><rect x="970" y="292" width="760" height="732" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">KONTROLA NÁVRHU</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">OVLÁDA OSOBA</text><rect x="100" y="389" width="700" height="116" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">1  Opísať zaplatený výdavok v EUR</text><text x="122" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Prehliadač vyžiada návrh.</text><rect x="100" y="540" width="700" height="149" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">2  Predbežná kontrola</text><text x="122" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Vstup + referenčný dátum, režim, živý súhlas,</text><text x="122" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">kontext, súbežnosť a kvóta.</text><rect x="100" y="724" width="700" height="125" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="767" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">3  Extrahovať</text><text x="122" y="806" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Adaptér: živý poskytovateľ alebo demo dáta.</text><rect x="100" y="884" width="700" height="106" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">4  Overiť + normalizovať</text><text x="122" y="966" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Použiteľný výstup → výsledok 200.</text><path d="M450 505 V538" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 689 V722" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 849 V882" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="389" width="700" height="129" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">5  Stav kontroly</text><text x="1022" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">ready / needs_input: upraviť; unsupported: neuložiť.</text><rect x="1000" y="551" width="700" height="142" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="1022" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">6  Opraviť alebo skončiť</text><text x="1022" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Opraviť needs_input pred uložením.</text><text x="1022" y="667" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Bez tichého finančného zápisu.</text><rect x="1000" y="727" width="700" height="144" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="770" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">7  Výslovné uloženie</text><text x="1022" y="809" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Osoba potvrdí polia, potom POST transakcie.</text><path d="M800 937 H900 V454 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1350 518 V549" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1350 693 V725" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="906" width="700" height="84" rx="15" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1021" y="941" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B9761C" text-anchor="start">Úprava / zrušenie / navigácia / odhlásenie</text><text x="1021" y="973" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">zneplatní návrh; pred Uložiť bez výdavku.</text><rect x="70" y="1062" width="1660" height="102" rx="18" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="96" y="1104" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#B64E47" text-anchor="start">ODCHOD PRED ULOŽENÍM</text><text x="96" y="1141" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Odmietnutie či zlyhanie poskytovateľa → chyba; bez výdavku. Kvóta sa môže minúť.</text><path d="M100 615 H45 V1110 H68" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)" stroke-dasharray="9 8"/><path d="M100 786 H45" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8"/><rect x="70" y="1213" width="1660" height="840" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1213" width="1660" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1256" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ULOŽENIE S KĽÚČOM</text><text x="1706" y="1254" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">IBA VÝSLOVNÉ ULOŽENIE</text><rect x="98" y="1322" width="475" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="120" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">8  Kontrola obsahu API</text><text x="120" y="1404" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Kľúč účtu + kanonický obsah.</text><text x="120" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Zlý tvar → 400 pred DB.</text><rect x="659" y="1322" width="475" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="681" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">9  Transakcia SQLite</text><text x="681" y="1404" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">BEGIN IMMEDIATE; vyhľadať</text><text x="681" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">(user_id, key).</text><rect x="1220" y="1322" width="475" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1242" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">10  Výsledok s kľúčom</text><text x="1242" y="1404" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">COMMIT alebo ROLLBACK; odpoveď</text><text x="1242" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">201, 400 / 404 alebo 409.</text><path d="M1350 1024 H1745 V1288 H335 V1320" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M573 1410 H657" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1134 1410 H1218" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="98" y="1605" width="375" height="148" rx="18" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="116" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#0D625F" text-anchor="start">NOVÝ / PLATNÝ</text><text x="116" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Atómový výdavok + požiadavka</text><text x="116" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">COMMIT → 201</text><rect x="498" y="1605" width="375" height="148" rx="18" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="516" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#B64E47" text-anchor="start">NOVÝ / NEPLATNÝ</text><text x="516" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Zlý dátum / kategória</text><text x="516" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">ROLLBACK → 400 / 404</text><rect x="898" y="1605" width="375" height="148" rx="18" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="916" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#0D625F" text-anchor="start">EXISTUJE / ROVNAKÝ</text><text x="916" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Výdavok existuje: pôvodné 201</text><text x="916" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">COMMIT; bez vloženia či vrátenia</text><rect x="1298" y="1605" width="375" height="148" rx="18" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="1316" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#B64E47" text-anchor="start">409 · ROLLBACK</text><text x="1316" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Rovnaký kľúč, iný obsah</text><text x="1316" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Rovnaký obsah, zmazaný originál</text><path d="M1457 1499 V1550 H286 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1457 1550 H686 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1457 1550 H1086 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1457 1550 H1486 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="98" y="1833" width="1598" height="173" rx="18" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="122" y="1877" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#B9761C" text-anchor="start">NEISTÁ ODPOVEĎ  ·  strata / 5xx / limit</text><text x="122" y="1920" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Zmraziť presný obsah a kľúč. Zopakovať ROVNAKÝ POST s vyhľadaním kľúča.</text><text x="122" y="1954" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Ak nič nebolo potvrdené, opakovanie môže vložiť prvý riadok; nikdy nevytvorí druhý.</text><path d="M98 1900 H45 V1410 H96" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/></svg>