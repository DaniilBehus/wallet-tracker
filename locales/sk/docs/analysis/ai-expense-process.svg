<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2260" viewBox="0 0 1800 2260" role="img"><title>Zadanie výdavku s AI</title><desc>Požiadavka a kontrola návrhu sú oddelené od výslovného uloženia s kľúčom; zobrazené sú chyby aj neistá odpoveď.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2260" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYTICKÁ MAPA</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Zadanie výdavku s AI</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Návrh ponúka upraviteľné polia; výdavok zapíše až neskoršie výslovné Uložiť</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="2187" x2="1730" y2="2187" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2223" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULÁRNA SÉRIA</text><text x="1730" y="2223" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">02 / 06</text><rect x="70" y="292" width="760" height="767" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">POŽIADAVKA NA NÁVRH</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">BEZ FINANČNÉHO ZÁPISU</text><rect x="100" y="388" width="700" height="118" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">1  Opísať zaplatený výdavok v EUR</text><text x="122" y="470" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Vyžiadať voliteľný návrh AI.</text><rect x="100" y="538" width="700" height="159" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="581" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">2  Predbežná kontrola</text><text x="122" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Overiť požiadavku, režim a súhlas.</text><text x="122" y="654" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Overiť vlastný kontext, súbežnosť a kvótu.</text><rect x="100" y="730" width="700" height="124" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="773" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">3  Adaptér extrakcie</text><text x="122" y="812" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Dáta demo alebo zapnutý živý poskytovateľ.</text><rect x="100" y="887" width="700" height="127" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="930" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">4  Overiť + normalizovať</text><text x="122" y="969" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Použiteľná odpoveď → návrh 200.</text><path d="M450 506 V536" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 697 V728" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 854 V885" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="970" y="292" width="760" height="767" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">KONTROLA NÁVRHU</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">OSOBA RIADI ULOŽENIE</text><rect x="1000" y="388" width="700" height="136" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">5  Stav návrhu</text><text x="1022" y="470" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">ready / needs_input → upraviteľná kontrola.</text><text x="1022" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">unsupported → nemožno uložiť.</text><rect x="1000" y="556" width="700" height="155" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="1022" y="599" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">6  Opraviť alebo zrušiť</text><text x="1022" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Opraviť chýbajúce / neplatné polia.</text><text x="1022" y="672" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Zrušiť pred Uložiť → bez výdavku.</text><rect x="1000" y="743" width="700" height="128" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="786" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">7  Potvrdiť výslovné Uložiť</text><text x="1022" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Pokračuje len vedomé potvrdenie platných polí.</text><rect x="1000" y="904" width="700" height="111" rx="17" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1022" y="946" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Úprava opisu, zrušenie, navigácia či odhlásenie</text><text x="1022" y="980" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">→ zneplatní čakajúcu odpoveď návrhu.</text><path d="M800 951 H900 V456 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1350 524 V554" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1350 711 V741" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="1380" y="545" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0D625F" text-anchor="start">ready / needs_input</text><rect x="70" y="1093" width="1660" height="140" rx="20" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="98" y="1139" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#B64E47" text-anchor="start">ZLYHANIE PRED ULOŽENÍM</text><text x="98" y="1182" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Kontrola / poskytovateľ / zlý výstup → chyba. Unsupported 200 → bez uloženia výdavku.</text><text x="98" y="1216" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Kvóta sa môže minúť aj pri zlyhaní generovania.</text><path d="M100 620 H45 V1164 H68" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)" stroke-dasharray="9 8"/><path d="M100 792 H45" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8"/><path d="M100 950 H45" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8"/><path d="M1000 500 H930 V1091" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)" stroke-dasharray="9 8"/><rect x="70" y="1290" width="1660" height="540" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1290" width="1660" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1333" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">VÝSLOVNÝ FINANČNÝ ZÁPIS</text><text x="1706" y="1331" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ODDELENÝ OD NÁVRHU</text><rect x="98" y="1395" width="465" height="176" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="120" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">8  Osoba potvrdí</text><text x="120" y="1477" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Ready / opravené needs_input</text><text x="120" y="1511" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">polia sa najprv skontrolujú.</text><rect x="665" y="1395" width="465" height="176" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="687" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">9  POST s kľúčom</text><text x="687" y="1477" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Kľúč viazaný na účet a kanonický</text><text x="687" y="1511" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">obsah výdavku; bez tichého uloženia.</text><rect x="1230" y="1395" width="465" height="176" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1252" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">10  Potvrdené 201</text><text x="1252" y="1477" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Uloží sa jeden skutočný výdavok</text><text x="1252" y="1511" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">až po úspešnom uložení s kľúčom.</text><path d="M1350 1059 H1745 V1350 H330 V1393" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M563 1483 H663" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1130 1483 H1228" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="1151" y="1460" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0D625F" text-anchor="start">201</text><rect x="98" y="1640" width="735" height="141" rx="19" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="122" y="1687" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#B64E47" text-anchor="start">DEFINITÍVNE ODMIETNUTIE</text><text x="122" y="1728" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Neplatné uloženie vráti upraviteľný návrh;</text><text x="122" y="1760" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">odmietnutie nezapíše výdavok.</text><rect x="958" y="1640" width="737" height="141" rx="19" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="982" y="1687" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#B9761C" text-anchor="start">NEISTÁ ODPOVEĎ</text><text x="982" y="1728" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Strata odpovede / limit / 5xx: zápis môže existovať.</text><text x="982" y="1760" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Zmraziť ROVNAKÝ obsah a kľúč; zopakovať operáciu.</text><path d="M895 1571 V1610 H465 V1638" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)"/><path d="M895 1610 H1326 V1638" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1695 1720 H1755 V1375 H900 V1393" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="70" y="1883" width="1660" height="232" rx="21" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="98" y="1930" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0D625F" text-anchor="start">HRANICA ZÁPISU</text><text x="98" y="1976" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Návrh je len odporúčanie, nikdy transakcia. Unsupported nemožno uložiť.</text><text x="98" y="2015" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Neisté uloženie sa kontroluje tým istým kľúčom a obsahom; nový kľúč môže vytvoriť ďalší výdavok.</text><text x="98" y="2054" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Vetvy potvrdenia, opakovania, konfliktu a záznamu po vymazaní sú na mape 05.</text><path d="M900 1830 V1881" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/></svg>