<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1790" viewBox="0 0 1800 1790" role="img"><title>Možnosti Wallet</title><desc>Moduly prístupu, výdavkov, kategórií, platieb, limitov, mesačného prehľadu a AI návrhov.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="1790" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYTICKÁ MAPA</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Čo umožňuje Wallet</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Prepojené možnosti, nie povinný sled obrazoviek či platieb</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="1717" x2="1730" y2="1717" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="1753" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULÁRNA SÉRIA</text><text x="1730" y="1753" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">01 / 06</text><rect x="600" y="292" width="600" height="172" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="600" y="292" width="600" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="624" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PRÍSTUP K ÚČTU</text><text x="1176" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">REGISTRÁCIA / PRIHLÁSENIE</text><text x="628" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#193039" text-anchor="start">Chráni osobné záznamy uvedené nižšie.</text><rect x="600" y="571" width="600" height="369" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="600" y="571" width="600" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="624" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">EVIDENCIA VÝDAVKOV</text><text x="1176" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">LOKÁLNE ZÁZNAMY</text><rect x="630" y="665" width="540" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="652" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Zaznamenať výdavky</text><text x="652" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Pridať, upraviť alebo vymazať zaplatený výdavok.</text><text x="652" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Sumy sa ukladajú v eurocentoch.</text><rect x="70" y="571" width="470" height="279" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="571" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">KATEGÓRIE</text><text x="516" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">ZOSKUPOVANIE</text><rect x="96" y="664" width="418" height="146" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="118" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Spravovať kategórie</text><text x="118" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Vytvoriť skupiny výdavkov.</text><text x="118" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Nastaviť alebo zrušiť limity kategórií.</text><rect x="1260" y="571" width="470" height="279" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="1260" y="571" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1284" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PRAVIDELNÉ PLATBY</text><text x="1706" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">PLÁNOVANIE</text><rect x="1286" y="664" width="418" height="146" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="1308" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Spravovať platby</text><text x="1308" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Opakované platby alebo pôžičky.</text><text x="1308" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Zaplatené splátky zaznamenať lokálne.</text><rect x="70" y="1085" width="470" height="272" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1085" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ROZPOČTY</text><text x="516" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">AKTUÁLNE LIMITY</text><rect x="96" y="1177" width="418" height="143" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="118" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Nastaviť / zrušiť limity</text><text x="118" y="1259" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Signály celkového a kategórnych limitov.</text><text x="118" y="1293" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Neblokujú platné uloženie.</text><rect x="600" y="1085" width="600" height="272" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="600" y="1085" width="600" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="624" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PREHĽAD MESIACA</text><text x="1176" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">PRI ČÍTANÍ</text><rect x="630" y="1177" width="540" height="143" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="652" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Zobraziť zvolený mesiac</text><text x="652" y="1259" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Skutočné výdavky, príjem a</text><text x="652" y="1293" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">súčty kategórií so stavmi limitov.</text><rect x="1260" y="1085" width="470" height="272" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="1260" y="1085" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1284" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">VOLITEĽNÝ NÁVRH AI</text><text x="1706" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">NÁVRH</text><rect x="1286" y="1166" width="418" height="171" rx="20" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1308" y="1209" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#B9761C" text-anchor="start">Skontrolovať, potom uložiť</text><text x="1308" y="1248" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Návrh v demo alebo živom režime.</text><text x="1308" y="1282" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Skontrolovať navrhnuté polia.</text><text x="1308" y="1316" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Výslovné Uložiť zapíše výdavok.</text><path d="M900 464 V569" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="912" y="508" width="148" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="920" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">PRIHLÁSENÝ</text><path d="M540 754 H598" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="537" y="699" width="109" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="545" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">SKUPINA</text><path d="M1260 781 H1202" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1152" y="726" width="135" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="1160" y="750" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">ZAPLATENÉ</text><path d="M900 940 V1083" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="912" y="994" width="148" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="920" y="1018" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">SKUTOČNOSŤ</text><path d="M305 850 V1083" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="317" y="970" width="148" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="325" y="994" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">LIMIT KAT.</text><path d="M540 1239 H598" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="536" y="1184" width="96" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="544" y="1208" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">LIMITY</text><path d="M1260 1245 H1230 V910 H1202" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="1208" y="981" width="135" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="1216" y="1005" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">VOLITEĽNÉ</text><rect x="70" y="1441" width="1660" height="206" rx="22" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="98" y="1489" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0D625F" text-anchor="start">HRANICA ROZSAHU</text><text x="98" y="1534" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">Pravidelná platba zaznamená splátku lokálne; Wallet neposiela peniaze ani nevykoná platbu.</text><text x="98" y="1574" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">Návrh AI je voliteľný. Prístup je podmienkou chránených záznamov, nie opakovaným krokom.</text></svg>