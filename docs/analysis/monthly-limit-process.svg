<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2070" viewBox="0 0 1800 2070" role="img"><title>Overall monthly limit</title><desc>Current setting and saved expenses are compared on read; the limit never blocks a valid save.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2070" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYSIS MAP</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Overall monthly limit</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Current settings and actual expenses become a read-time status, never a save gate</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="1997" x2="1730" y2="1997" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2033" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULAR SERIES</text><text x="1730" y="2033" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">03 / 06</text><rect x="70" y="292" width="760" height="638" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">COMMANDS</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">WRITE</text><rect x="970" y="292" width="760" height="638" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PERSISTENCE</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">SQLITE</text><rect x="100" y="389" width="700" height="160" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Settings write</text><text x="122" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Requires monthly_income_cents.</text><text x="122" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Set integer L = 0..100000000 cents; NULL clears.</text><rect x="100" y="581" width="700" height="140" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="624" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Omit limit or reject invalid input</text><text x="122" y="663" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Omission preserves current L.</text><text x="122" y="697" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Invalid settings write → no change.</text><rect x="100" y="751" width="700" height="133" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="794" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Record valid expense</text><text x="122" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Expense validation is independent of L.</text><rect x="1000" y="389" width="700" height="160" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Current settings row</text><text x="1022" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Income is separate; L is one current value.</text><text x="1022" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">NULL means no limit; 0 is a real limit.</text><rect x="1000" y="751" width="700" height="133" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="794" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Actual expense rows</text><text x="1022" y="833" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Valid expense saves even if T will exceed L.</text><path d="M800 469 H900 V469 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="846" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0D625F" text-anchor="start">valid settings</text><path d="M800 816 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="850" y="795" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#0D625F" text-anchor="start">valid save</text><rect x="70" y="1020" width="760" height="585" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1020" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">SELECTED-MONTH QUERY</text><text x="806" y="1061" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">READ</text><rect x="970" y="1020" width="760" height="585" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="1020" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="1063" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">STATUS JUDGEMENT</text><text x="1706" y="1061" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">DERIVED</text><rect x="100" y="1118" width="700" height="125" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="1161" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">GET selected month</text><text x="122" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">A standalone read needs no prior write.</text><rect x="100" y="1277" width="700" height="163" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1320" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Aggregate T</text><text x="122" y="1359" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Sum actual saved expenses for that month.</text><text x="122" y="1393" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Income is excluded.</text><rect x="100" y="1472" width="700" height="105" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1515" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Apply current L</text><text x="122" y="1554" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">The same current limit applies to historical months.</text><path d="M450 1243 V1275" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 1440 V1470" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 930 V980 H450 V1116" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><text x="764" y="998" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">read actuals + current settings</text><rect x="1000" y="1118" width="700" height="141" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="1161" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Compare T with L</text><text x="1022" y="1200" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">L = NULL → not_set; otherwise compare.</text><text x="1022" y="1234" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Remaining L − T is calculated, never stored.</text><path d="M800 1525 H900 V1188 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="1300" width="330" height="114" rx="17" fill="#EFF2EF" stroke="#EFF2EF" stroke-width="0"/><text x="1019" y="1343" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">NOT SET</text><text x="1019" y="1388" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">L = NULL</text><rect x="1350" y="1300" width="330" height="114" rx="17" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1369" y="1343" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WITHIN</text><text x="1369" y="1388" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &lt; L</text><rect x="1000" y="1447" width="330" height="114" rx="17" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1019" y="1490" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B9761C" text-anchor="start">REACHED</text><text x="1019" y="1535" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T = L</text><rect x="1350" y="1447" width="330" height="114" rx="17" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="1369" y="1490" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B64E47" text-anchor="start">EXCEEDED</text><text x="1369" y="1535" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &gt; L</text><path d="M1360 1259 V1276 H1165 V1298" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1276 H1515 V1298" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1276 H1715 V1428 H1165 V1445" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1715 1428 H1515 V1445" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="1683" width="1660" height="231" rx="21" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="98" y="1730" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#B9761C" text-anchor="start">ATTACHED LIMIT RULES</text><text x="98" y="1778" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">L = 0 and T = 0 is REACHED. Remaining can be negative; no limit gives NULL remaining.</text><text x="98" y="1815" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Every valid expense remains saveable in every state. Overall and category limits are independent;</text><text x="98" y="1852" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">the overall settings write does not cross-validate the sum of category limits.</text><path d="M1360 1605 V1645 H900 V1681" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/></svg>