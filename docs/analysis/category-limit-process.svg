<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2180" viewBox="0 0 1800 2180" role="img"><title>Category spending limits</title><desc>Independent writes and a selected-month summary produce four per-category limit states.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2180" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYSIS MAP</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Category limits · modular system map</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Commands write independent records; a query builds and judges visible rows</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="2107" x2="1730" y2="2107" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2143" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULAR SERIES</text><text x="1730" y="2143" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">04 / 06</text><rect x="70" y="292" width="760" height="658" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">COMMANDS</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">WRITE</text><rect x="970" y="292" width="760" height="658" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PERSISTENCE</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">SQLITE</text><rect x="100" y="392" width="700" height="120" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">PATCH owned category</text><text x="122" y="474" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Only limit field; 0 is real, NULL clears.</text><rect x="100" y="542" width="700" height="120" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Validate + check owner</text><text x="122" y="624" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Empty / unknown PATCH → 400; foreign / missing → 404.</text><path d="M450 512 V540" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="100" y="693" width="700" height="120" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="736" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Record valid expense / paid instalment</text><text x="122" y="775" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Independent action: limit is never a save gate.</text><rect x="1000" y="392" width="700" height="120" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="435" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Category limit L</text><text x="1022" y="474" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Current integer cents or NULL; no month history.</text><rect x="1000" y="693" width="700" height="120" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="736" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Actual expenses</text><text x="1022" y="775" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Valid payment saves even when category is exceeded.</text><path d="M800 602 H900 V452 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="855" y="584" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0D625F" text-anchor="start">valid PATCH</text><path d="M800 753 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="855" y="738" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0D625F" text-anchor="start">valid save</text><rect x="100" y="842" width="700" height="72" rx="15" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="122" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#B64E47" text-anchor="start">REFUSED PATCH → no category write</text><path d="M450 662 V675 H80 V878 H98" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)"/><rect x="70" y="1060" width="760" height="650" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1060" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">SUMMARY QUERY</text><text x="806" y="1101" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">READ</text><rect x="970" y="1060" width="760" height="650" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="1060" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="1103" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ROW JUDGEMENT</text><text x="1706" y="1101" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">DERIVED</text><rect x="100" y="1160" width="700" height="116" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">GET selected month</text><text x="122" y="1242" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Standalone or after any successful write.</text><rect x="100" y="1307" width="700" height="133" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1350" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Aggregate T</text><text x="122" y="1389" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Saved expenses incl. paid instalments;</text><text x="122" y="1423" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">exclude unpaid instalments + income.</text><rect x="100" y="1471" width="700" height="170" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="1514" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Visible rows</text><text x="122" y="1553" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Limited T = 0 included; unlimited T = 0 hidden.</text><text x="122" y="1587" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Uncategorised only if T &gt; 0; no limit editor.</text><path d="M450 1276 V1305" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 1440 V1469" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 950 V1000 H450 V1158" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><text x="780" y="1030" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="start">read actuals + current L</text><rect x="1000" y="1160" width="700" height="145" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Current L vs actual T</text><text x="1022" y="1242" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">NULL = not_set; else compare per visible row.</text><text x="1022" y="1276" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Current limit applies to historical month.</text><path d="M800 1555 H900 V1235 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="1350" width="330" height="115" rx="16" fill="#EFF2EF" stroke="#EFF2EF" stroke-width="0"/><text x="1018" y="1392" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">NOT SET</text><text x="1018" y="1437" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">L = NULL</text><rect x="1350" y="1350" width="330" height="115" rx="16" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1368" y="1392" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WITHIN</text><text x="1368" y="1437" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &lt; L</text><rect x="1000" y="1510" width="330" height="115" rx="16" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1018" y="1552" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B9761C" text-anchor="start">REACHED</text><text x="1018" y="1597" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T = L</text><rect x="1350" y="1510" width="330" height="115" rx="16" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="1368" y="1552" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B64E47" text-anchor="start">EXCEEDED</text><text x="1368" y="1597" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193039" text-anchor="start">T &gt; L</text><path d="M1360 1305 V1324 H1165 V1348" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1324 H1515 V1348" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1360 1324 H1715 V1480 H1165 V1508" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1715 1480 H1515 V1508" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="1770" width="1660" height="228" rx="22" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="98" y="1819" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#B9761C" text-anchor="start">ATTACHED READ RULES</text><text x="98" y="1862" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">Remaining = L − T is calculated, not stored. L = 0 and T = 0 is REACHED.</text><text x="98" y="1904" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">Overall and category limits are independent. A category state never rejects a valid save.</text><path d="M1360 1710 V1740 H900 V1768" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/></svg>