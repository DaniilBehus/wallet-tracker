<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1790" viewBox="0 0 1800 1790" role="img"><title>Wallet capabilities</title><desc>Modules for account access, expenses, categories, schedules, limits, month review and optional AI drafts.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="1790" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYSIS MAP</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">What Wallet helps you do</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Connected capabilities, not a required screen or payment sequence</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="1717" x2="1730" y2="1717" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="1753" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULAR SERIES</text><text x="1730" y="1753" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">01 / 06</text><rect x="600" y="292" width="600" height="172" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="600" y="292" width="600" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="624" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">ACCOUNT ACCESS</text><text x="1176" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">REGISTER / SIGN IN</text><text x="628" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#193039" text-anchor="start">Protects the personal records below.</text><rect x="600" y="571" width="600" height="369" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="600" y="571" width="600" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="624" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">EXPENSE LEDGER</text><text x="1176" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">LOCAL RECORDS</text><rect x="630" y="665" width="540" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="652" y="708" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Record expenses</text><text x="652" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Add, edit or delete a paid expense.</text><text x="652" y="781" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Amounts are stored in EUR cents.</text><rect x="70" y="571" width="470" height="279" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="571" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">CATEGORIES</text><text x="516" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">GROUPING</text><rect x="96" y="664" width="418" height="146" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="118" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Manage categories</text><text x="118" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Create groups for expenses.</text><text x="118" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Set or clear category limits.</text><rect x="1260" y="571" width="470" height="279" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="1260" y="571" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1284" y="614" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">SCHEDULES</text><text x="1706" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">PLANNING</text><rect x="1286" y="664" width="418" height="146" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="1308" y="707" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Manage schedules</text><text x="1308" y="746" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Recurring charges or finite loans.</text><text x="1308" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Record paid instalments locally.</text><rect x="70" y="1085" width="470" height="272" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1085" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">BUDGETS</text><text x="516" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">CURRENT LIMITS</text><rect x="96" y="1177" width="418" height="143" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="118" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Set or clear limits</text><text x="118" y="1259" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Overall and category signals.</text><text x="118" y="1293" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">They do not block a valid save.</text><rect x="600" y="1085" width="600" height="272" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="600" y="1085" width="600" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="624" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">MONTH REVIEW</text><text x="1176" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">READ TIME</text><rect x="630" y="1177" width="540" height="143" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="652" y="1220" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">Review selected month</text><text x="652" y="1259" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Actual expenses, income and</text><text x="652" y="1293" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">category totals with limit states.</text><rect x="1260" y="1085" width="470" height="272" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="1260" y="1085" width="470" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1284" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">OPTIONAL AI DRAFT</text><text x="1706" y="1126" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">SUGGESTION</text><rect x="1286" y="1166" width="418" height="171" rx="20" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1308" y="1209" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#B9761C" text-anchor="start">Review, then Save</text><text x="1308" y="1248" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Demo or live draft.</text><text x="1308" y="1282" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Review suggested fields.</text><text x="1308" y="1316" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Explicit Save writes an expense.</text><path d="M900 464 V569" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="912" y="508" width="187" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="920" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">AUTHENTICATED</text><path d="M540 754 H598" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="537" y="699" width="83" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="545" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">GROUP</text><path d="M1260 781 H1202" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1152" y="726" width="70" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="1160" y="750" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">PAID</text><path d="M900 940 V1083" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="912" y="994" width="109" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="920" y="1018" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">ACTUALS</text><path d="M305 850 V1083" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="317" y="970" width="148" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="325" y="994" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">CATEGORY L</text><path d="M540 1239 H598" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="536" y="1184" width="96" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="544" y="1208" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">LIMITS</text><path d="M1260 1245 H1230 V910 H1202" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/><rect x="1208" y="981" width="122" height="35" rx="8" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><text x="1216" y="1005" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#61747A" text-anchor="start">OPTIONAL</text><rect x="70" y="1441" width="1660" height="206" rx="22" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="98" y="1489" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0D625F" text-anchor="start">SCOPE BOUNDARY</text><text x="98" y="1534" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">A schedule records a local paid instalment; Wallet does not send money or execute a charge.</text><text x="98" y="1574" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#193039" text-anchor="start">An AI draft is optional. Access is a prerequisite for protected records, not a repeated workflow step.</text></svg>