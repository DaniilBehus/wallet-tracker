<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2190" viewBox="0 0 1800 2190" role="img"><title>Draft then explicit save</title><desc>Three modules show draft generation, human review, keyed persistence and retry outcomes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147C76"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B64E47"/></marker></defs><rect x="0" y="0" width="1800" height="2190" rx="0" fill="#F7F4ED" stroke="#F7F4ED" stroke-width="0"/><rect x="70" y="52" width="75" height="68" rx="18" fill="#147C76" stroke="#147C76" stroke-width="0"/><text x="107" y="98" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text><text x="169" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0D625F" text-anchor="start">WALLET  /  ANALYSIS MAP</text><text x="70" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="47" font-weight="700" fill="#193039" text-anchor="start">Draft → Save · modular system map</text><text x="70" y="218" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#61747A" text-anchor="start">Three bounded modules connect draft generation, review and keyed persistence</text><line x1="70" y1="247" x2="1730" y2="247" stroke="#D6E1DE" stroke-width="2"/><line x1="70" y1="2117" x2="1730" y2="2117" stroke="#D6E1DE" stroke-width="2"/><text x="70" y="2153" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="start">WALLET  /  MODULAR SERIES</text><text x="1730" y="2153" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#61747A" text-anchor="end">05 / 06</text><rect x="70" y="292" width="760" height="732" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">DRAFT GENERATION</text><text x="806" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">NO EXPENSE WRITE</text><rect x="970" y="292" width="760" height="732" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="970" y="292" width="760" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="994" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">REVIEW SESSION</text><text x="1706" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">USER CONTROL</text><rect x="100" y="389" width="700" height="116" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">1  Describe paid EUR expense</text><text x="122" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Browser requests a draft.</text><rect x="100" y="540" width="700" height="149" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="583" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">2  Preflight</text><text x="122" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Input + reference date, enabled mode, live consent,</text><text x="122" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">context, concurrency slot and quota.</text><rect x="100" y="724" width="700" height="125" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="122" y="767" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">3  Extract</text><text x="122" y="806" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Adapter: live provider or local demo fixture.</text><rect x="100" y="884" width="700" height="106" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="122" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">4  Validate + normalize</text><text x="122" y="966" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Usable output → 200 result.</text><path d="M450 505 V538" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 689 V722" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M450 849 V882" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="389" width="700" height="129" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="432" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">5  Review status</text><text x="1022" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">ready / needs_input: editable; unsupported: unsaveable.</text><rect x="1000" y="551" width="700" height="142" rx="20" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><text x="1022" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">6  Correct or stop</text><text x="1022" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Correct needs_input before Save.</text><text x="1022" y="667" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">No implicit financial write.</text><rect x="1000" y="727" width="700" height="144" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1022" y="770" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">7  Explicit Save</text><text x="1022" y="809" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">User confirms valid fields, then POST transaction.</text><path d="M800 937 H900 V454 H998" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1350 518 V549" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1350 693 V725" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1000" y="906" width="700" height="84" rx="15" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="1021" y="941" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#B9761C" text-anchor="start">Edit / cancel / navigate / sign out</text><text x="1021" y="973" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">invalidates the draft; before Save: no expense.</text><rect x="70" y="1062" width="1660" height="102" rx="18" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="96" y="1104" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#B64E47" text-anchor="start">PRE-SAVE EXIT</text><text x="96" y="1141" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Refusal or provider failure → fixed error; no expense. Quota may still be consumed.</text><path d="M100 615 H45 V1110 H68" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrRed)" stroke-dasharray="9 8"/><path d="M100 786 H45" fill="none" stroke="#B64E47" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8"/><rect x="70" y="1213" width="1660" height="840" rx="24" fill="#FFFFFF" stroke="#D6E1DE" stroke-width="2"/><rect x="70" y="1213" width="1660" height="65" rx="24" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="94" y="1256" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">KEYED PERSISTENCE</text><text x="1706" y="1254" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#61747A" text-anchor="end">EXPLICIT SAVE ONLY</text><rect x="98" y="1322" width="475" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="120" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">8  API payload gate</text><text x="120" y="1404" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Account-scoped key + canonical payload.</text><text x="120" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Bad shape → 400 before DB.</text><rect x="659" y="1322" width="475" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="681" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">9  SQLite transaction</text><text x="681" y="1404" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">BEGIN IMMEDIATE; look up</text><text x="681" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">(user_id, key).</text><rect x="1220" y="1322" width="475" height="177" rx="20" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="1242" y="1365" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#0D625F" text-anchor="start">10  Keyed result</text><text x="1242" y="1404" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">COMMIT or ROLLBACK; respond</text><text x="1242" y="1438" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">with 201, 400 / 404 or 409.</text><path d="M1350 1024 H1745 V1288 H335 V1320" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M573 1410 H657" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1134 1410 H1218" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="98" y="1605" width="375" height="148" rx="18" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="116" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#0D625F" text-anchor="start">NEW / VALID</text><text x="116" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Atomic expense + request</text><text x="116" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">COMMIT → 201</text><rect x="498" y="1605" width="375" height="148" rx="18" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="516" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#B64E47" text-anchor="start">NEW / INVALID</text><text x="516" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Bad date/category</text><text x="516" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">ROLLBACK → 400 / 404</text><rect x="898" y="1605" width="375" height="148" rx="18" fill="#E8F4F1" stroke="#E8F4F1" stroke-width="0"/><text x="916" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#0D625F" text-anchor="start">EXISTING / SAME</text><text x="916" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Expense exists: original 201</text><text x="916" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">COMMIT; no insert or revert</text><rect x="1298" y="1605" width="375" height="148" rx="18" fill="#FAEAE7" stroke="#FAEAE7" stroke-width="0"/><text x="1316" y="1645" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#B64E47" text-anchor="start">409 · ROLLBACK</text><text x="1316" y="1684" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Same key, changed payload</text><text x="1316" y="1716" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#193039" text-anchor="start">Same payload, deleted original</text><path d="M1457 1499 V1550 H286 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1457 1550 H686 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1457 1550 H1086 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1457 1550 H1486 V1603" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><rect x="98" y="1833" width="1598" height="173" rx="18" fill="#FFF0D7" stroke="#FFF0D7" stroke-width="0"/><text x="122" y="1877" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#B9761C" text-anchor="start">UNCERTAIN RESPONSE  ·  lost reply / 5xx / timeout</text><text x="122" y="1920" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Freeze the exact payload + key. Retry the SAME POST through the keyed lookup.</text><text x="122" y="1954" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#193039" text-anchor="start">Retry may be the first insert if nothing committed; replay never creates a second row.</text><path d="M98 1900 H45 V1410 H96" fill="none" stroke="#147C76" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="9 8"/></svg>